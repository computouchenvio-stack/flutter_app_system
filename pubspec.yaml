name: flutter_app_system
description: "Sistema multiplataforma Flutter para Windows e Android com arquitetura limpa."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  riverpod_annotation: ^2.1.0

  # HTTP & API
  dio: ^5.3.0
  retrofit: ^4.0.0

  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^12.0.0

  # UI & Design
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.0

  # Utilities
  get_it: ^7.6.0
  equatable: ^2.0.5
  uuid: ^4.0.0

  # Logging
  logger: ^2.0.0

  # Validation
  validators: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  retrofit_generator: ^7.0.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
